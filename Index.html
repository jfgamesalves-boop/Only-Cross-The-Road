function chooseSecondaryMissions(){
  const pool=MISSION_DEFS.slice();
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  return pool.slice(0,3).map(m=>({id:m.id,progress:0,completed:false,target:m.target}));
}
function missionDefinition(id){return MISSION_DEFS.find(m=>m.id===id);}
function recordMission(id,amount=1){
  if(game.challengeMode)return; // desafios especiais não avançam missões da campanha.
  if(!Array.isArray(game.activeMissions)||!Number.isFinite(amount)||amount<=0)return;
  let changed=false;
  for(const mission of game.activeMissions){
    if(mission.id!==id||mission.completed)continue;
    const def=missionDefinition(id);if(!def)continue;
    mission.progress=Math.min(mission.target||def.target,mission.progress+amount);changed=true;
    if(mission.progress>=(mission.target||def.target)){
      mission.completed=true;game.wallet+=50;game.message=`MISSÃO CONCLUÍDA! +50 MOEDAS`;game.messageTimer=2.4;sfx('win');
    }
  }
  if(changed&&game.activeMissions.every(m=>m.completed))game.message='TODAS AS MISSÕES SECUNDÁRIAS CONCLUÍDAS!';
  if(changed&&game.activeMissions.some(m=>m.completed&&m.progress===m.target))safeSave();
}
function onPhaseCompleted(){
  if(game.challengeMode)return; // provas especiais não contam como fases nem missões da campanha.
  recordMission('completePhases',1);
  if(!game.damageTakenThisPhase)recordMission('cleanPhases',1);
  if(game.levelTime<=25)recordMission('quickPhases',1);
}

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function rand(a,b){ return a + Math.random()*(b-a); }
function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
function roundedRect(c,x,y,w,h,r,fill,stroke,lw=1){
  c.beginPath(); c.roundRect(x,y,w,h,r);
  if(fill){c.fillStyle=fill;c.fill();}
  if(stroke){c.lineWidth=lw;c.strokeStyle=stroke;c.stroke();}
}
function text(str,x,y,size=14,color='#fff',weight=700,align='left'){
  ctx.font=`${weight} ${size}px system-ui, sans-serif`; ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline='middle'; ctx.fillText(str,x,y);
}
function drawSpeechBubble(x,y,speaker,message){
  const width=202,pad=10;ctx.font='700 8px system-ui, sans-serif';const words=String(message).split(' '),lines=[];let line='';
  for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>width-pad*2&&line){lines.push(line);line=word;}else line=test;}if(line)lines.push(line);
  const boxH=27+lines.length*11;roundedRect(ctx,x-width/2,y-boxH,width,boxH,8,'rgba(7,13,20,.95)','#ffe18a',1.5);
  ctx.fillStyle='#ffe18a';ctx.beginPath();ctx.moveTo(x-6,y);ctx.lineTo(x+6,y);ctx.lineTo(x,y+8);ctx.closePath();ctx.fill();
  text(speaker,x,y-boxH+10,8,'#ffd34e',900,'center');lines.forEach((ln,i)=>text(ln,x,y-boxH+22+i*11,8,'#fff',800,'center'));
}
function drawButton(x,y,w,h,label,action,opts={}){
  const {locked=false,small=false,sub='',active=false}=opts;
  const fill=active?'rgba(237,57,71,.20)':'rgba(12,20,28,.76)';
  roundedRect(ctx,x,y,w,h,12,fill,locked?'rgba(154,171,183,.38)':'#ed3947',1.8);
  if(active){ctx.shadowColor='rgba(237,57,71,.45)';ctx.shadowBlur=0;roundedRect(ctx,x,y,w,h,12,null,'#ff6871',1);ctx.shadowBlur=0;}
  text(label,x+w/2, y+(sub? h*.40:h/2),small?13:15,locked?'#77838d':'#fff0e8',800,'center');
  if(sub) text(sub,x+w/2,y+h*.72,9,locked?'#77838d':'#b6c4ce',600,'center');
  game.buttons.push({x,y,w,h,action,locked});
}
function fitCanvas(){
  const w=window.innerWidth, h=window.innerHeight;
  const dpr=window.devicePixelRatio||1;
  pixelRatio=game.graphicsQuality==='high'?Math.min(dpr,1.5):game.graphicsQuality==='medium'?Math.min(dpr,1):Math.min(dpr,0.72);
  canvas.width=Math.floor(w*pixelRatio); canvas.height=Math.floor(h*pixelRatio);
  scale=Math.min(w/BASE_W,h/BASE_H); offsetX=(w-BASE_W*scale)/2; offsetY=(h-BASE_H*scale)/2;
  ctx.setTransform(pixelRatio*scale,0,0,pixelRatio*scale,pixelRatio*offsetX,pixelRatio*offsetY);
}
window.addEventListener('resize',fitCanvas); fitCanvas();

let percussionNoiseBuffer=null;
function brazilNoiseHit(kind,volume,duration=.075){
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const now=audioCtx.currentTime;
    if(!percussionNoiseBuffer){
      const length=Math.floor(audioCtx.sampleRate*.24);
      percussionNoiseBuffer=audioCtx.createBuffer(1,length,audioCtx.sampleRate);
      const data=percussionNoiseBuffer.getChannelData(0);
      for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*(.8+Math.random()*.2);
    }
    const src=audioCtx.createBufferSource(),filter=audioCtx.createBiquadFilter(),gain=audioCtx.createGain();
    src.buffer=percussionNoiseBuffer;
    filter.type=kind==='shaker'?'highpass':'bandpass';
    filter.frequency.setValueAtTime(kind==='shaker'?6200:kind==='snare'?1900:950,now);
    filter.Q.value=kind==='shaker'?.7:1.1;
    gain.gain.setValueAtTime(Math.max(.0001,volume),now);
    gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
    src.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);
    src.start(now);src.stop(now+duration);
  }catch(e){}
}
function brazilDrumHit(freq,volume,duration=.18){
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const now=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type='sine';o.frequency.setValueAtTime(freq*1.65,now);o.frequency.exponentialRampToValueAtTime(freq,now+duration*.55);
    g.gain.setValueAtTime(volume,now);g.gain.exponentialRampToValueAtTime(.0001,now+duration);
    o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+duration);
  }catch(e){}
}
function musicPercussion(style,index,volume){
  if(!style)return;
  // Camada rítmica original: surdo grave, caixa estalada e chocalho contínuo.
  const bossBoost=style==='bossSamba'?.16:style==='finalSamba'?.22:.13;
  if(index%4===0){brazilDrumHit(style==='finalSamba'?68:style==='bossSamba'?62:74,.075*volume+bossBoost*volume,.22);}
  if(index%4===2){brazilDrumHit(style==='finalSamba'?82:style==='bossSamba'?72:88,.052*volume+bossBoost*.55*volume,.14);}

function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null;}musicTrackKey='';}
function startMusic(){
  if(!game.musicEnabled||game.musicVolume<=0){stopMusic();return;}
  try{

    if(audioCtx.state==='suspended')audioCtx.resume();
    const wanted=currentMusicTrack();
    if(musicTimer&&musicTrackKey===wanted)return;

    musicTrackKey=wanted;musicIndex=0;
    const track=MUSIC_TRACKS[wanted]||MUSIC_TRACKS.menu;

function bossHitbox(b){
  // Limites acompanham a parte realmente desenhada do chefe, não a pista inteira.
  const dims={
    green:[-54,54,-69,45],bee:[-54,54,-69,45],alien:[-54,54,-69,45],
    magma:[-60,60,-80,55],bone:[-67,67,-92,57],
    cyberMini:[-56,56,-88,49],droneMini:[-60,60,-33,34],spiderMini:[-94,94,-42,43],
    cyber:[-82,82,-127,65],colossal:[-190,190,-330,-35],
    wormMini:[-84,118,-43,39],moonArmorMini:[-62,62,-100,49],magmaMinionMini:[-48,48,-64,46]
  };
  const d=dims[b.type]||[-54,54,-68,48];
  return {left:b.x+d[0],right:b.x+d[1],top:b.y+d[2],bottom:b.y+d[3]};
}
function circleTouchesBossBody(b,x,y,r=9){
  const h=bossHitbox(b),cx=(h.left+h.right)/2,cy=(h.top+h.bottom)/2;
  const rx=Math.max(1,(h.right-h.left)/2+r*.82),ry=Math.max(1,(h.bottom-h.top)/2+r*.82);
  const dx=(x-cx)/rx,dy=(y-cy)/ry;
  return dx*dx+dy*dy<=1;
}
function distToSegment(px,py,ax,ay,bx,by){const vx=bx-ax,vy=by-ay,l2=vx*vx+vy*vy||1,t=clamp(((px-ax)*vx+(py-ay)*vy)/l2,0,1);return Math.hypot(px-(ax+vx*t),py-(ay+vy*t));}
function bossProjectileHits(b,o){return circleTouchesBossBody(b,o.x,o.y,o.r||9);}
function playerTouchesBoss(b,p){return circleTouchesBossBody(b,p.x,p.y,p.r||11);}

function nearbyInteraction(){
  const p=game.player;if(!p)return null;
  if(game.dragon&&game.dragon.mode==='good'&&!game.dragon.domesticated&&dist(p,game.dragon)<62)return {kind:'dragon',x:game.dragon.x,y:game.dragon.y};
  if(game.phase===67&&dist(p,{x:76,y:365})<72)return {kind:'statue67',x:76,y:365};
  if(game.phase===55&&game.secret55Found&&dist(p,{x:535,y:430})<86)return {kind:'jorge',x:535,y:430};
  if(game.phase===1&&game.secretHouseFound&&dist(p,{x:200,y:790})<68)return {kind:'house',x:200,y:790};
  if(game.phase===90&&game.diamondChest&&!game.diamondChestOpened&&!game.diamondChest.opened&&dist(p,game.diamondChest)<55)return {kind:'diamondChest',x:game.diamondChest.x,y:game.diamondChest.y};
  if(game.phase===38&&dist(p,{x:85,y:365})<58)return {kind:'thales',x:85,y:365};
  if(game.phase===60&&p.y>575&&dist(p,{x:150,y:745})<66)return {kind:'alvaro',x:150,y:745};
  if(game.chest&&!game.chest.opened&&dist(p,game.chest)<48)return {kind:'chest',x:game.chest.x,y:game.chest.y};
  return null;
}

function interact(){
  const target=nearbyInteraction();if(!target)return false;
  if(target.kind==='dragon'){
    game.dragon.domesticated=true;unlockShirt('dragon');game.dragon.attackTimer=.8;
    showDialogue([[game.playerName.toUpperCase(),'Você quer vir comigo?']]);game.message='DRAGÃO DOMESTICADO!';game.messageTimer=1.6;sfx('dragon');return true;
  }
  if(target.kind==='statue67'){markEasterEggSeen('statue67');unlockShirt('sixseven');showDialogue([[game.playerName.toUpperCase(),'Alguém realmente veio até aqui só pra colocar isso.']]);return true;}
  if(target.kind==='jorge'){markEasterEggSeen('jorge');showDialogue([[game.playerName.toUpperCase(),'Uma lenda dessas merece uma estátua.']]);return true;}
  if(target.kind==='house'){markEasterEggSeen('secretHouse');showDialogue([[game.playerName.toUpperCase(),'Tem alguém aí?']]);return true;}
  if(target.kind==='thales'){markEasterEggSeen('thales');awardAchievement('loucuraDobro');showDialogue([[game.playerName.toUpperCase(),'Você também tá atravessando a rua?'],['THALES','Sai daqui.']]);return true;}
  if(target.kind==='alvaro'){markEasterEggSeen('alvaro');awardAchievement('muitaFome');unlockShirt('burger');showDialogue([[game.playerName.toUpperCase(),'Ô, o que é que você tá fazendo aqui?'],['ÁLVARO','Comendo.']]);return true;}
  if(target.kind==='chest'){openOrdinaryChest();return true;}
  if(target.kind==='diamondChest'){openDiamondChest();return true;}
  return false;
}
function useInventoryItem(){
  const kind=game.selectedItem;if(!game.inventory[kind]||game.inventory[kind]<=0){game.message='VOCÊ NÃO TEM ESSE ITEM!';game.messageTimer=1.1;return;}
  game.inventory[kind]--;recordMission('usePower',1);
  if(kind==='shield'){game.powerTimers.shield=18;game.shieldHits=0;game.message='ESCUDO ATIVADO!';}
  else if(kind==='speed'){game.powerTimers.speed=7;game.message='SUPER VELOCIDADE ATIVADA!';}
  else if(kind==='jump'){game.player.jumpCharges=1;game.message='PULO ÚNICO PRONTO!';}
  else if(kind==='star'){game.cars=[];game.hazards=[];if(game.boss)game.boss.projectiles=[];/* Partículas removidas: não tinham desenho no jogo. */game.message='ESTRELA! PERIGOS LIMPOS!';}
  game.messageTimer=1.7;sfx('win');safeSave();
}

function damageBoss(){
  // Idempotente: apenas o primeiro golpe fatal pode iniciar o encerramento.
  const b=game.boss;if(!b||game.bossDefeated||b.defeated||b.hp<=0||b.hitCooldown>0)return;
  if(b.type==='colossal'&&b.shieldActive){b.shieldHitsLeft--;b.flash=.25;b.hitCooldown=.68;sfx('hit');if(b.shieldHitsLeft<=0){b.shieldActive=false;b.shieldStage++;}return;}
  b.hp--;b.flash=.35;b.hitCooldown=.72;sfx('hit');particle(b.x,b.y,'#ffe17c',16);
  if(b.type==='colossal'&&((b.hp===7&&b.shieldStage===0)||(b.hp===3&&b.shieldStage===1))){b.shieldActive=true;b.shieldHitsLeft=3;b.hitCooldown=1.0;}
  game.message=isMiniBossType(b.type)?`ACERTOU! ${b.hp} VIDAS`:'';game.messageTimer=isMiniBossType(b.type)?1.0:0;

    else if(o.kind==='cyberBeam'){o.life-=dt;if(o.life<=0){b.projectiles.splice(i,1);continue;}if(o.life<=.72&&Math.abs(p.x-o.x)<18&&p.y>(b.type==='colossal'?o.y:220)&&p.y<(b.type==='colossal'?695:585)&&p.invuln<=0)hurtPlayer('cyber');}
    else if(o.kind==='cyberSweep'){o.life-=dt;if(o.life<=0){b.projectiles.splice(i,1);continue;}const active=o.life<=.72;if(active&&Math.abs(p.y-o.y)<14&&p.x>18&&p.x<382&&p.invuln<=0)hurtPlayer('cyber');}
    else if(o.kind==='rockMeteor'){
      o.x+=o.vx*dt;o.y+=o.vy*dt;
      if(dist(p,o)<o.r+10&&p.invuln<=0){hurtPlayer();if(game.screen!=='playing')return;}
      if(o.y>=o.gy){
        // Alguns meteoros ficam no chão para o jogador pegar; sempre existe ao menos um disponível.
        const have=game.items.filter(i=>i.kind==='meteorRock').length+(p.held==='meteorRock'?1:0);
        if((o.stay&&have<2)||have===0){game.items.push({kind:'meteorRock',x:clamp(o.x,50,350),y:o.gy});game.message='METEORO NO CHÃO! PEGUE E ARREMESSE!';game.messageTimer=1.5;}
        b.projectiles.splice(i,1);continue;
      }
    }
    else if(o.kind==='beam'){o.life-=dt;if(o.life<=0){b.projectiles.splice(i,1);continue;}if(o.life<=.68&&Math.abs(p.x-o.x)<19&&p.y>220&&p.invuln<=0)hurtPlayer();}
    else if(o.kind==='demon'||o.kind==='enemyMeatball'||o.kind==='bossCar'||o.kind==='meteor'||o.kind==='lavaOrb'||o.kind==='bone'){
      o.x+=o.vx*dt;o.y+=o.vy*dt;if(o.rot!==undefined)o.rot+=dt*9;
      if(dist(p,o)<(o.r||18)+10&&p.invuln<=0){if(o.kind==='bossCar'){if(!absorbShieldCarHit())hurtPlayer();}else hurtPlayer();}
    }
    if(o.kind==='bossCar'&&(o.x<-100||o.x>500)){b.projectiles.splice(i,1);continue;}
    if((o.kind==='demon'||o.kind==='enemyMeatball'||o.kind==='meteor'||o.kind==='lavaOrb'||o.kind==='bone')&&(o.y>610||o.x<-50||o.x>450||o.life!==undefined&&o.life<=0)){b.projectiles.splice(i,1);continue;}
    if(o.kind==='barrel'&&o.landed&&o.explode>0&&dist(p,o)<38&&p.invuln<=0)hurtPlayer();
    if(o.kind==='tire'&&o.landed&&o.drop&&dist(p,o)<29){p.held='tire';b.projectiles.splice(i,1);sfx('pickup');game.message='PNEU PEGADO! TOQUE AÇÃO PARA ARREMESSAR.';game.messageTimer=1.6;}
  }
  // Se algum projétil encerrou o chefe, não processe colisões ou ataques adicionais.
  if(game.bossDefeated)return;
  // Pegar carne e pistolas que efetivamente caíram.
  for(let i=game.items.length-1;i>=0;i--){const it=game.items[i];if(it.kind==='chaosCore'&&it.ty!==undefined&&it.y<it.ty-2)continue;if(dist(p,it)<27){if(it.kind==='meat'&&b.type!=='wormMini'&&(!b.tired||b.wormTimer>0))continue;p.held=it.kind;game.items.splice(i,1);sfx('pickup');game.message=it.kind==='meat'?(b.type==='wormMini'?'CARNE PEGADA! JOGUE NA MINHOCA.':'CARNE PEGADA! JOGUE NO BUMBLEBEE CANSADO.'):it.kind==='gun'?'PISTOLA PEGADA! TOQUE AÇÃO PARA ATIRAR.':it.kind==='meteorRock'?'METEORO PEGADO! TOQUE AÇÃO PARA ARREMESSAR.':it.kind==='chaosCore'?'NÚCLEO CIBERNÉTICO PEGADO! TOQUE AÇÃO PARA ARREMESSAR.':'NÚCLEO PEGADO! TOQUE AÇÃO PARA DEVOLVER.';game.messageTimer=1.7;}}
  if(['green','bee','alien','magma','bone','wormMini','magmaMinionMini'].includes(b.type)&&playerTouchesBoss(b,p)&&p.invuln<=0&&b.dashActive<=0)hurtPlayer();
  if(['cyberMini','droneMini','spiderMini','moonArmorMini','cyber'].includes(b.type)&&playerTouchesBoss(b,p)&&p.invuln<=0&&b.dashActive<=0)hurtPlayer('cyber');
}

// ------------------------ PLAYER / GAMEPLAY --------------------
function setDirection(x,y){
  if(game.boss&&game.boss.introTimer>0){game.input={x:0,y:0};game.heldDir=null;return;}
  if(game.screen==='playing'&&!game.eventBossFight&&!game.bossDefeated&&!game.boss&&x===0&&y<0&&game.player.jumpCharges>0){jumpPlayer();game.input={x:0,y:0};game.heldDir=null;return;}
  if(game.bossDefeated||game.scriptedEvent)return;game.input={x,y};game.heldDir={x,y};
}
function clearDirection(){game.input={x:0,y:0};game.heldDir=null;}
function hurtPlayer(cause='hazard'){
  const p=game.player;if(p.invuln>0)return;
  game.lastHitCause=cause;game.damageTakenThisPhase=true;
  game.lives--;p.invuln=1.15;sfx('hit');particle(p.x,p.y,'#ff5c66',12);game.shake=.18;
  safeSave();
  if(game.lives<=0){
    // Desafios extras não contam como derrotas, sequência de mortes ou game overs da campanha.
    if(game.challengeMode){game.challengeMode.deaths=(game.challengeMode.deaths||0)+1;}
    else{
      if(cause==='badDragon')awardAchievement('incinerated');
      game.deathStreak++;game.totalDeaths++;game.campaignGameOvers++;
      if(game.deathStreak>=10&&!game.achievements.death10)awardAchievement('death10');
      if(game.deathStreak>=50&&!game.achievements.death50)awardAchievement('death50');
      if(game.deathStreak>=100&&!game.achievements.death100){awardAchievement('death100');unlockShirt('skull');}
    }
    game.screen='gameover';game.eventBossFight=null;game.input={x:0,y:0};clearDirection();safeSave();
  }
  else {p.x=200;p.y=570;p.held=null;game.message='CUIDADO!';game.messageTimer=.8;}
}
// Barreira invisível do penhasco final: o jogador não passa das partes pontiagudas (pontas até y≈398).
const COLOSSAL_CLIFF_BARRIER=420;
function updatePlayer(dt){
  const p=game.player;let dx=game.input.x,dy=game.input.y;
  const mag=Math.hypot(dx,dy);if(mag>1){dx/=mag;dy/=mag;}
  const speed=game.boss?170:(game.powerTimers.speed>0?285:178);
  if(Math.abs(dx)>.05&&Math.abs(dy)>.05)recordMission('diagonalDistance',speed*dt);
  const bridgeMode=!!(game.challengeMode&&game.challengeMode.id==='bridgeCollapse');
  const rightLimit=bridgeMode?316:(!game.challengeMode&&game.phase===55&&!game.boss)?610:376;
  const leftLimit=bridgeMode?84:((!game.challengeMode&&game.phase===55&&game.secret55Found)?370:24);
  const colossalArena=!!(game.boss&&game.boss.type==='colossal');
  const backLimit=colossalArena?690:((!game.challengeMode&&(game.phase===1||game.phase===60||game.phase===90)&&!game.boss)?900:584);
  const arenaLeft=colossalArena?12:leftLimit,arenaRight=colossalArena?388:rightLimit;
  p.x=clamp(p.x+dx*speed*dt,arenaLeft,arenaRight);
  const topLimit=colossalArena?COLOSSAL_CLIFF_BARRIER:112;
  const nextPlayerY=p.y+dy*speed*dt;
  // Na arena do Colossal, ultrapassar a borda inferior do penhasco causa queda e Game Over.
  if(colossalArena&&nextPlayerY>backLimit){
    p.y=backLimit+8;p.invuln=0;game.lives=1;game.message='VOCÊ CAIU DO PENHASCO!';game.messageTimer=1.2;
    hurtPlayer('cliffFall');return;
  }
  p.y=clamp(nextPlayerY,topLimit,backLimit);
  if(!game.challengeMode&&game.phase===55&&p.x>392&&!game.secret55Found){game.secret55Found=true;markEasterEggSeen('jorge');game.message='VOCÊ ENCONTROU UM SEGREDO!';game.messageTimer=2.2;awardAchievement('jorge');sfx('win');}
  if(!game.challengeMode&&game.phase===67&&dist(p,{x:76,y:365})<105)markEasterEggSeen('statue67');
  if(!game.challengeMode&&game.phase===38&&dist(p,{x:85,y:365})<95)markEasterEggSeen('thales');
  if(!game.challengeMode&&game.phase===60&&p.y>575&&dist(p,{x:150,y:745})<105)markEasterEggSeen('alvaro');
  if(!game.challengeMode&&game.phase===90&&!game.boss&&p.y>620)markEasterEggSeen('diamondCave');
  if(!game.challengeMode&&game.phase===1&&!game.boss&&p.y>575&&!game.secretHouseFound&&Math.hypot(p.x-200,p.y-806)<31){game.secretHouseFound=true;markEasterEggSeen('secretHouse');game.message='CASA SECRETA ENCONTRADA!';game.messageTimer=2.2;awardAchievement('backhouse');sfx('win');}
  if(mag>.1){p.face=Math.atan2(dy,dx);p.anim+=dt;sfxStepMaybe();}
  if(p.invuln>0)p.invuln-=dt;
  if(p.jumpCooldown>0)p.jumpCooldown=Math.max(0,p.jumpCooldown-dt);
  if(p.jumpTimer>0)p.jumpTimer=Math.max(0,p.jumpTimer-dt);
  if(game.powerTimers.shield>0)game.powerTimers.shield=Math.max(0,game.powerTimers.shield-dt);
  if(game.powerTimers.speed>0)game.powerTimers.speed=Math.max(0,game.powerTimers.speed-dt);
}
let stepSfxTimer=0;function sfxStepMaybe(){if(elapsed-stepSfxTimer>.32){stepSfxTimer=elapsed;sfx('run');}}
function absorbShieldCarHit(){
  if(game.powerTimers.shield<=0||game.shieldHits>=1)return false;
  game.powerTimers.shield=0;game.shieldHits=1;
  // Brief invulnerability prevents the same overlapping vehicle from taking another life.
  game.player.invuln=Math.max(game.player.invuln,1.25);
  particle(game.player.x,game.player.y,'#77eaff',20);
  game.message='ESCUDO BLOQUEOU A BATIDA!';game.messageTimer=1.5;sfx('hit');
  return true;
}
function updateCars(dt){
  for(const c of game.cars){
    c.x+=c.speed*dt;
    if(c.speed>0&&c.x>455){c.x=-90;c.nearMissionLogged=false;}
    if(c.speed<0&&c.x<-90){c.x=455;c.nearMissionLogged=false;}
  }
  const p=game.player;
  for(const c of game.cars){
    const dy=Math.abs(p.y-c.y),dx=Math.abs(p.x-c.x);
    const hitY=c.h*.55+8,hitX=c.w*.43+7;
    if(p.invuln<=0&&dy<hitY&&dx<hitX){if(!absorbShieldCarHit())hurtPlayer();break;}
    if(p.invuln<=0&&!c.nearMissionLogged&&dy<hitY+8&&dx>hitX+2&&dx<hitX+38&&Math.hypot(game.input.x,game.input.y)>.1){
      c.nearMissionLogged=true;recordMission('nearMissCars',1);
    }
  }
}
function updateHazards(dt){
  const p=game.player;
  for(const h of game.hazards){h.phase+=dt;
    if(h.customChallenge){
      if(!h.eliteHazard){h.x+=Math.sin(h.phase*1.7)*((h.vx||0)*.35)*dt;h.y+=Math.sin(h.phase*1.25)*((h.vy||0)*.35)*dt;}
      if(h.type==='crystalFall'){h.y+=(h.vy||90)*dt;if(h.y>565){h.y=145;h.x=rand(55,345);}}
      if(h.type==='skyLift'||h.type==='swingBamboo'||h.type==='mirrorWall'||h.type==='canyonRock'||h.type==='press')h.y+=Math.sin(h.phase*1.8)*(h.vy||18)*dt;
      if(h.type==='iceBlock'||h.type==='seaMine'||h.type==='bookGhost'||h.type==='orbitDebris'||h.type==='cableCar'||h.type==='gear')h.x+=(h.vx||30)*dt;
      if(h.x<45||h.x>355)h.vx=-(h.vx||30);
      const d=Math.hypot(p.x-h.x,p.y-h.y),active=h.type==='press'?Math.sin(h.phase*2)>.05:h.type==='gravityPulse'?Math.sin(h.phase*1.7)>.45:h.type==='icePatch'?false:true;
      if(h.type==='seaCurrent'&&d<h.r+35)p.x=clamp(p.x+Math.sign(h.vx||1)*42*dt,24,376);
      if(h.type==='icePatch'&&d<h.r){p.x=clamp(p.x+Math.sin(h.phase*3)*62*dt,24,376);}
      if(h.type==='gravityPulse'&&d<h.r&&Math.sin(h.phase*1.7)>.45)p.y=clamp(p.y-Math.sign(Math.sin(h.phase*2.3))*48*dt,112,584);
      if(active&&d<h.r+10&&p.invuln<=0)hurtPlayer('customChallenge');
      continue;
    }
    if(h.dynamicChallenge){h.life-=dt;h.x+=h.vx*dt;h.y+=h.vy*dt;if(h.x<38||h.x>362)h.vx*=-1;if(h.y<155||h.y>550)h.vy*=-1;}
    if(h.type==='fire'&&Math.hypot(p.x-h.x,p.y-h.y)<h.r+9&&p.invuln<=0)hurtPlayer();
    if(h.type==='crack'&&Math.hypot(p.x-h.x,p.y-h.y)<h.r*.72&&p.invuln<=0)hurtPlayer();
    if(h.type==='tracks'){
      const cycle=h.phase%8;
      if(cycle>3.2&&cycle<6.3){const trainX=-150+((cycle-3.2)/3.1)*700;if(Math.abs(p.y-h.y)<22&&Math.abs(p.x-trainX)<112&&p.invuln<=0)hurtPlayer();}
    }
    if(h.type==='sandstorm'&&Math.sin(h.phase*1.2)>.75){p.x=clamp(p.x+Math.sin(h.phase*5)*45*dt,24,376);}
    if(h.type==='worm'){
      // A minhoca percorre a área em um movimento ondulado, sem sair da pista.
      if(h.wormBaseX===undefined){h.wormBaseX=h.x;h.wormBaseY=h.y;h.wormOffset=rand(0,Math.PI*2);}
      h.x=clamp(h.wormBaseX+Math.sin(h.phase*.82+h.wormOffset)*27,58,342);
      h.y=clamp(h.wormBaseY+Math.sin(h.phase*1.13+h.wormOffset*.7)*11,155,548);
      // Hitbox elíptica acompanha o corpo comprido e a cabeça, incluindo a margem do jogador.
      const wx=(p.x-(h.x+8))/57, wy=(p.y-h.y)/31;
      if(wx*wx+wy*wy<1&&p.invuln<=0)hurtPlayer();
    }
    if(h.type==='vortex'&&Math.sin(h.phase*1.6)>.2){const d=Math.hypot(p.x-h.x,p.y-h.y);if(d<52){p.x+=((h.x-p.x)/Math.max(1,d))*45*dt;if(d<20&&p.invuln<=0)hurtPlayer();}}
    if(h.type==='alien'||h.type==='monster'){
      h.x=clamp(h.x+Math.sin(h.phase*1.7)*(game.world===3?14:30)*dt,45,355);
      if(Math.hypot(p.x-h.x,p.y-h.y)<h.r+10&&p.invuln<=0)hurtPlayer();
    }
    if(h.type==='laser'&&isMoonLaserActive(h)&&Math.abs(p.y-h.y)<9&&p.invuln<=0)hurtPlayer();
    if(h.type==='cheese'&&!h.landed){h.y+=100*dt;if(h.y>560){h.y=rand(180,250);h.x=rand(35,365);}}
    if(h.type==='cheese'&&Math.hypot(p.x-h.x,p.y-h.y)<h.r+9&&p.invuln<=0)hurtPlayer();
    if(h.type==='geyser'){const active=(h.phase%5.2)>1.8&&(h.phase%5.2)<3.2;if(active&&Math.hypot(p.x-h.x,p.y-h.y)<30&&p.invuln<=0)hurtPlayer();}
    if(h.type==='magmaBug'){h.x+=h.vx*dt;h.y+=h.vy*dt;if(h.x<35||h.x>365)h.vx*=-1;if(h.y<200||h.y>545)h.vy*=-1;if(Math.hypot(p.x-h.x,p.y-h.y)<h.r+10&&p.invuln<=0)hurtPlayer();}
    if(h.type==='lavaRiver'&&Math.abs(p.x-h.x)<15&&p.y>132&&p.y<580&&p.invuln<=0)hurtPlayer();
    if(h.type==='meteor'||h.type==='cyberRain'){h.x+=h.vx*dt;h.y+=h.vy*dt;if(h.y>575){h.y=rand(135,205);h.x=rand(25,375);}if(Math.hypot(p.x-h.x,p.y-h.y)<h.r+9&&p.invuln<=0)hurtPlayer(h.type==='cyberRain'?'cyber':'meteor');}
    if(h.type==='cyberBeam'&&isCyberBeamHazardActive(h)&&Math.abs(p.y-h.y)<12&&p.x>24&&p.x<376&&p.invuln<=0)hurtPlayer('cyber');
    if(h.type==='cyberDrone'||h.type==='cyberBot'||h.type==='cyberMinion'){h.x+=h.vx*dt;if(h.x<35||h.x>365)h.vx*=-1;h.y+=Math.sin(h.phase*2.2)*13*dt;if(Math.hypot(p.x-h.x,p.y-h.y)<h.r+11&&p.invuln<=0)hurtPlayer('cyber');}
    if(h.type==='bridgeGap'&&Math.abs(p.y-h.y)<20&&Math.abs(p.x-h.x)<h.r+12&&p.invuln<=0)hurtPlayer('bridge');
    if(h.type==='pterosaur'||h.type==='trex'||h.type==='spinosaurus'){
      h.x+=h.vx*dt;
      if(h.x<42||h.x>358){h.vx*=-1;h.facing=Math.sign(h.vx);}
      h.y=clamp((h.baseY||h.y)+Math.sin(h.phase*(h.type==='pterosaur'?2.5:1.5))*(h.type==='pterosaur'?18:9),190,548);
      const hitRadius=h.type==='pterosaur'?34:h.type==='trex'?39:41;
      if(Math.hypot(p.x-h.x,p.y-h.y)<hitRadius&&p.invuln<=0)hurtPlayer();
    }
  }
  game.hazards=game.hazards.filter(h=>!h.dynamicChallenge||h.life>0);
}
function spawnPowerItem(){
  // A estrela destruidora é muito mais rara que os outros itens (5% das aparições).
  const roll=Math.random();const kind=roll<.34?'shield':roll<.66?'speed':roll<.95?'jump':'star';
  game.items.push({kind,x:rand(42,358),y:rand(205,525),life:10,phase:rand(0,6)});
  game.message=kind==='shield'?'ITEM: ESCUDO!':kind==='speed'?'ITEM: SUPER VELOCIDADE!':kind==='star'?'ITEM: ESTRELA DESTRUIDORA!':'ITEM: PULO ÚNICO!';game.messageTimer=1.25;sfx('pickup');
}
function updatePowerItems(dt){
  game.powerSpawn-=dt;
  if(game.powerSpawn<=0&&game.items.length===0){spawnPowerItem();game.powerSpawn=rand(8,13);}
  for(let i=game.items.length-1;i>=0;i--){const it=game.items[i];if(!['shield','speed','star','jump'].includes(it.kind))continue;it.life-=dt;it.phase+=dt;
    if(dist(game.player,it)<27){
      recordMission('collectPower',1);
      if(it.kind==='shield'){game.powerTimers.shield=18;game.shieldHits=0;game.message='ESCUDO ATIVO: AGUENTA 1 CARRO!';}
      else if(it.kind==='speed'){game.powerTimers.speed=7;game.message='SUPER VELOCIDADE ATIVA!';}
      else if(it.kind==='jump'){game.player.jumpCharges=1;game.message='PULO ÚNICO DISPONÍVEL!';}
      else {game.cars=[];game.hazards=[];/* Partículas removidas: não tinham desenho no jogo. */game.message='ESTRELA! TUDO FOI DERRUBADO!';}
      game.messageTimer=1.8;game.items.splice(i,1);sfx('win');continue;
    }
    if(it.life<=0)game.items.splice(i,1);
  }
}
function updateDragon(dt){
  const d=game.dragon;if(!d)return;
  // O dragão é um evento exclusivo dos mundos até a Lua (fases 1–75).
  // Ao entrar em qualquer mundo posterior, ele é removido imediatamente.
  if(game.phase>75){game.dragon=null;return;}
  if(game.screen!=='playing')return;
  const p=game.player;d.wing+=dt*8;d.attackTimer-=dt;
  // O dragão hostil abandona a perseguição após cinco fases desde seu aparecimento.
  if(d.mode==='bad' && game.phase>=d.spawnPhase+5){game.dragon=null;game.message='O DRAGÃO FOI EMBORA!';game.messageTimer=1.5;return;}
  if(d.mode==='bad'){
    const dx=p.x-d.x,dy=p.y-d.y,m=Math.hypot(dx,dy)||1;
    d.x+=dx/m*105*dt;d.y+=dy/m*105*dt;
    if(Math.hypot(p.x-d.x,p.y-d.y)<34&&p.invuln<=0)hurtPlayer('badDragon');
    return;
  }
  // O dragão aliado só acompanha/ajuda depois que o jogador o domestica pelo botão de ação.
  if(!d.domesticated){d.x+=Math.sin(elapsed*1.7)*18*dt;d.y+=Math.cos(elapsed*1.3)*12*dt;return;}
  if(game.boss){
    const tx=game.boss.x-76,ty=game.boss.y-55;
    d.x+=(tx-d.x)*Math.min(1,dt*2.8);d.y+=(ty-d.y)*Math.min(1,dt*2.8);
  }else{
    const tx=p.x-48,ty=p.y-48;
    d.x+=(tx-d.x)*Math.min(1,dt*3.2);d.y+=(ty-d.y)*Math.min(1,dt*3.2);
  }
  if(d.attackTimer<=0){
    d.attackTimer=game.boss?1.55:2.15;sfx('fire');
    const tx=game.boss?game.boss.x:d.x+rand(-25,25),ty=game.boss?game.boss.y+15:100;
    const dx=tx-d.x,dy=ty-d.y,m=Math.hypot(dx,dy)||1;

function createWorldEventSchedule(){
  const schedule={};
  const reservedCanada=[2,4,8,12,18,20,22,25];
  const rainTypes=['safeMeteorRain','safeCheeseRain','safeSkullRain'];
  for(let world=1;world<=6;world++){
    const first=world===6?126:(world-1)*25+1,last=world===6?175:world*25;
    let candidates=[];
    for(let phase=first+1;phase<last;phase++){
      if(world===1&&reservedCanada.includes(phase))continue;
      candidates.push(phase);
    }
    // Dois níveis diferentes por mundo: um para o sono e outro para a chuva.
    const sleepIndex=Math.floor(Math.random()*candidates.length);
    const sleepPhase=candidates.splice(sleepIndex,1)[0];
    const rainIndex=Math.floor(Math.random()*candidates.length);
    const rainPhase=candidates.splice(rainIndex,1)[0];
    schedule[world]={sleepPhase,rainPhase,rainType:rainTypes[Math.floor(Math.random()*rainTypes.length)],sleepDone:false,rainDone:false};
  }
  return schedule;
}
function validWorldEventSchedule(schedule){

  for(let world=1;world<=6;world++){
    const e=schedule[world],first=world===6?126:(world-1)*25+1,last=world===6?175:world*25;

}

function eventBossName(kind){if(kind==='skull')return 'MINICHEFE DINOSSAURO';return kind==='cheese'?'MINICHEFE DE QUEIJO':kind==='meteor'?'MINICHEFE METEORO':kind==='skull'?'MINICHEFE CAVEIRA':'MINICHEFE COMETA';}
function startEventBossFight(kind){

function startSingleWeatherEvent(kind){

function maybeStartRareWeatherEvent(){
  // Um único sorteio por fase, inclusive após tentar novamente. As chuvas são raras.
  if(game.sideEvent||game.scriptedEvent||game.miniBoss||game.eventBossFight)return;
  const key=`${game.world}:${game.phase}`;
  const pend=game.pendingEventBoss;
  if(pend&&pend.key===key){game.rareEventRolledPhase=key;startEventBossFight(pend.kind);return;} // Game Over -> tentar o mesmo chefe de novo
  if(pend)game.pendingEventBoss=null;
  if(game.forceEventKind){const fk=game.forceEventKind;game.forceEventKind=null;game.rareEventRolledPhase=key;startEventBossFight(fk);return;}
  if(game.rareEventRolledPhase===key)return;
  game.rareEventRolledPhase=key;
  const roll=Math.random();
  if(roll<.0010){startAllElementsEvent();return;}          // 0,10%: evento completo
  if(roll<.0030){startSingleWeatherEvent('cheese');return;} // 0,20%
  if(roll<.0050){startSingleWeatherEvent('meteor');return;} // 0,20%
  if(roll<.0070){startSingleWeatherEvent('skull');return;}  // 0,20%
  if(roll<.0090){startSingleWeatherEvent('comet');return;}  // 0,20%
}
function throwEventBossItem(){

function updateEventBossFight(dt){
  const f=game.eventBossFight;if(!f)return;
  if(f.intro){updateEventIntro(f,dt);return;}
  f.timer+=dt;
  if(f.completed){f.victoryTimer-=dt;if(f.victoryTimer<=0){const rp=f.returnPos||{x:200,y:570};game.eventBossFight=null;game.pendingEventBoss=null;game.player.held=null;game.player.x=rp.x;game.player.y=rp.y;game.player.invuln=2.5;game.returnFlash=1;game.input={x:0,y:0};game.heldDir=null;game.wallet+=f.kind==='all'?100:45;game.message=f.kind==='all'?'QUATRO MINI-CHEFES DERROTADOS! +100 MOEDAS':'MINICHEFE DERROTADO! +45 MOEDAS';game.messageTimer=2.8;safeSave();}return;}
  const p=game.player,dx=game.input.x,dy=game.input.y,mag=Math.hypot(dx,dy)||1,speed=178;
  p.x=clamp(p.x+(dx/mag)*speed*dt,28,372);p.y=clamp(p.y+(dy/mag)*speed*dt,382,576);
  if(Math.hypot(dx,dy)>.1)p.anim+=dt;
  if(p.invuln>0)p.invuln=Math.max(0,p.invuln-dt);
  if(f.worm){f.worm.timer-=dt;if(f.worm.timer<=0)f.worm=null;}
  for(const e of f.enemies){
    if(e.hp<=0)continue;
    e.anim+=dt;e.flash=Math.max(0,e.flash-dt);
    e.x=e.baseX+Math.sin(f.timer*.9+e.id*1.8)*(f.enemies.length===1?20:8);
    e.attackTimer-=dt;
    if(e.attackTimer<=0&&f.projectiles.length<12){
      const r=Math.random(),type=r<.46?'car':r<.75?'tire':'meat';
      const tx=p.x-e.x,ty=p.y-(e.y+24),m=Math.hypot(tx,ty)||1;
      f.projectiles.push({type,x:e.x,y:e.y+25,vx:type==='car'?clamp(tx/m*105,-115,115):rand(-28,28),vy:type==='car'?190:145,life:5});
      e.attackTimer=rand(f.enemies.length===1?1.45:2.1,f.enemies.length===1?2.15:3.1);
    }
  }
  for(let i=f.projectiles.length-1;i>=0;i--){
    const o=f.projectiles[i];o.x+=o.vx*dt;o.y+=o.vy*dt;o.life-=dt;
    if(o.type==='car'){
      if(Math.abs(p.x-o.x)<31&&Math.abs(p.y-o.y)<24&&p.invuln<=0){f.projectiles.splice(i,1);hurtPlayer('eventBoss');if(game.screen!=='playing')return;continue;}
    }else if(o.y>=420){f.pickups.push({kind:o.type,x:clamp(o.x,35,365),y:clamp(o.y,430,555),life:8});f.projectiles.splice(i,1);continue;}
    if(o.life<=0||o.y>610||o.x<-80||o.x>480)f.projectiles.splice(i,1);
  }
  for(let i=f.pickups.length-1;i>=0;i--){
    const it=f.pickups[i];it.life-=dt;
    if(Math.hypot(p.x-it.x,p.y-it.y)<29&&!p.held){p.held=it.kind;game.message=it.kind==='tire'?'PNEU PEGADO! TOQUE AÇÃO PARA ARREMESSAR.':'CARNE PEGADA! A MINHOCA VAI AJUDAR.';game.messageTimer=1.7;sfx('pickup');f.pickups.splice(i,1);continue;}
    if(it.life<=0)f.pickups.splice(i,1);
  }
  for(let i=f.playerShots.length-1;i>=0;i--){
    const shot=f.playerShots[i],target=f.enemies.find(e=>e.id===shot.targetId&&e.hp>0);
    if(!target){f.playerShots.splice(i,1);continue;}
    const vx=target.x-shot.x,vy=target.y-shot.y,m=Math.hypot(vx,vy)||1;
    shot.x+=vx/m*shot.speed*dt;shot.y+=vy/m*shot.speed*dt;

  }
  if(f.enemies.every(e=>e.hp<=0)){f.completed=true;f.victoryTimer=2.0;f.projectiles.length=0;f.pickups.length=0;f.playerShots.length=0;game.player.invuln=999;game.input={x:0,y:0};game.heldDir=null;game.player.held=null;game.message=f.kind==='all'?'TODOS OS QUATRO FORAM DERROTADOS!':'MINICHEFE DERROTADO!';game.messageTimer=2.0;sfx('win');}

    if(ch.eliteSpawnTimer<=0&&eliteHazards.length<eliteCap){

  } else if(h.type==='pterosaur')drawPterosaur(h);

function buildStandaloneChallengeArena(id){
  // These first 20 challenges use their own obstacles and traffic. None of the
  // normal campaign hazards are carried into this separate game mode.
  game.cars=[];game.hazards=[];game.items=[];game.blueCoin=null;game.legendaryCoin=null;
  game.chest=null;game.diamondChest=null;game.dragon=null;game.miniBoss=null;game.sideEvent=null;
  game.scriptedEvent=null;game.eventBossFight=null;game.boss=null;game.bossDefeated=false;
  const add=(type,x,y,r=22,extra={})=>game.hazards.push({type,x,y,r,phase:rand(0,6.28),active:true,...extra});
  const pos=(i,n=5)=>({x:55+((i*79)%290),y:175+((i*83+n*17)%370)});
  const lanes=[167,231,295,359,423,487];
  const addTrack=(laneIndex,phaseOffset=0)=>{const h=add('tracks',200,lanes[laneIndex%lanes.length],25);h.phase=phaseOffset;};
  const addCars=(count,speedMin=90,speedMax=145)=>{
    for(let i=0;i<count;i++){
      const lane=i%lanes.length,dir=lane%2===0?1:-1;
      game.cars.push({x:rand(25,375),y:lanes[lane]+rand(-7,7),w:i%4===0?82:rand(58,76),h:i%4===0?31:29,
        speed:dir*rand(speedMin,speedMax)*(i%4===0?1.28:1),color:['#e34f4f','#4f9cdb','#e0b84e','#6ab77a','#a17ad6'][i%5],type:i%4===0?'sport':'normal',lane});
    }
  };
  const addDino=(type,x,y,r,vx)=>{const h=add(type,x,y,r,{baseY:y,vx,facing:Math.sign(vx)});return h;};
  if(id==='extremeCrossing'){
    [0,1,2,3].forEach((lane,i)=>addTrack(lane,i*1.65));
  }else if(id==='chaosSurvival'){
    [[90,255],[285,360],[165,485]].forEach(([x,y])=>add('crack',x,y,27));
    [[280,220],[115,430]].forEach(([x,y])=>add('vortex',x,y,29));
    add('fire',205,330,20);add('worm',300,515,30);
  }else if(id==='timeTrial'){
    addCars(8,105,160);
  }else if(id==='colossal'){
    addDino('trex',115,350,48,58);addDino('spinosaurus',285,470,49,-65);
  }else if(id==='traffic'){
    addCars(12,115,185);
  }else if(id==='unstable'){
    for(let i=0;i<5;i++){const q=pos(i);add('crack',q.x,q.y,27);}
  }else if(id==='meteorRain'){
    for(let i=0;i<9;i++){const q=pos(i);const h=add('meteor',q.x,135+(i%3)*38,14,{vx:rand(-30,30),vy:rand(145,220)});h.ancient=false;}
  }else if(id==='creatureZone'){
    [[85,260],[300,390],[185,510]].forEach(([x,y])=>add('worm',x,y,30));
    addDino('trex',125,345,40,37);addDino('spinosaurus',285,455,42,-43);
  }else if(id==='portals'){
    [[95,230],[300,330],[145,450],[290,535]].forEach(([x,y])=>add('vortex',x,y,29));
  }else if(id==='bridgeCollapse'){
    game.challengeMode.bridgeTimer=0;game.challengeMode.bridgeCracks=[];game.challengeMode.bridgeWarned=false;
  }else if(id==='tornadoMaze'){
    [[90,230],[300,320],[155,425],[280,525]].forEach(([x,y])=>add('vortex',x,y,30));
  }else if(id==='crackStorm'){
    for(let i=0;i<5;i++){const q=pos(i);add('crack',q.x,q.y,28);}
  }else if(id==='cyberBeamRun'){
    for(let i=0;i<3;i++){const q=pos(i);add('cyberBeam',q.x,q.y,18);}
  }else if(id==='cyberSwarm'){
    for(let i=0;i<6;i++){const q=pos(i);const h=add('cyberMinion',q.x,q.y,13);h.vx=rand(55,105)*(Math.random()<.5?-1:1);}
  }else if(id==='cyberRainFall'){
    for(let i=0;i<2;i++){const q=pos(i);const h=add('cyberRain',q.x,135+(i%4)*23,10);h.vx=rand(-38,38);h.vy=rand(160,245);}

function formatCampaignTime(seconds){
  const total=Math.max(0,Math.floor(seconds||0)),m=Math.floor(total/60),s=total%60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function drawAchievementToast(){
  const toast=game.achievementToast;if(!toast||game.screen!=='playing')return;
  const progress=3-toast.time;
  const alpha=Math.min(1,progress/.12,toast.time/.12);
  const slide=1-Math.pow(1-Math.min(1,progress/.16),3);
  const y=94-(1-slide)*12;
  ctx.save();ctx.globalAlpha=clamp(alpha,0,1);
  const grad=ctx.createLinearGradient(12,y,388,y+60);grad.addColorStop(0,'rgba(23,35,48,.98)');grad.addColorStop(1,'rgba(12,22,32,.98)');
  roundedRect(ctx,12,y,376,60,11,grad,'#e9bd52',1.8);
  roundedRect(ctx,15,y+3,66,54,8,'rgba(222,174,56,.13)','rgba(255,225,138,.24)',1);
  drawAchievementIcon(toast.id,48,y+30);
  ctx.strokeStyle='rgba(255,220,130,.48)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(89,y+10);ctx.lineTo(89,y+50);ctx.stroke();
  text('CONQUISTA DESBLOQUEADA',103,y+17,8,'#ffd86b',900,'left');
  let fontSize=14;ctx.font=`900 ${fontSize}px system-ui, sans-serif`;while(ctx.measureText(toast.name).width>270&&fontSize>10){fontSize--;ctx.font=`900 ${fontSize}px system-ui, sans-serif`;}
  text(toast.name,103,y+39,fontSize,'#fff7dd',900,'left');
  ctx.restore();
}

function drawPrehistoricFossils(){
  ctx.save();
  // Troncos antigos, cipós e copas que margeiam a estrada sem bloquear a pista.
  for(const side of [0,1]){
    const x=side===0?7:393;
    ctx.strokeStyle='#503e29';ctx.lineWidth=12;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(x,590);ctx.bezierCurveTo(x+(side?5:-5),485,x+(side?-4:4),330,x,175);ctx.stroke();
    ctx.strokeStyle='#6d5433';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,390);ctx.quadraticCurveTo(x+(side?-24:24),330,x+(side?-20:20),290);ctx.stroke();
    ctx.fillStyle='#284e34';for(let k=0;k<4;k++){ctx.beginPath();ctx.ellipse(x+(side?-9:9)+(k%2?7:-4),180+k*17,20,25,.2,0,Math.PI*2);ctx.fill();}
    ctx.strokeStyle='#7da15a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+(side?-13:13),290);ctx.quadraticCurveTo(x+(side?-25:25),248,x+(side?-16:16),218);ctx.stroke();
  }
  for(let side=0;side<2;side++){
    const x=side===0?13:387;
    for(let j=0;j<3;j++){
      const y=220+j*145;
      ctx.globalAlpha=.74;
      ctx.strokeStyle='#d7c79b';ctx.lineWidth=3;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(x,y-22);ctx.quadraticCurveTo(x+(side?6:-6),y,x,y+22);ctx.stroke();
      for(let k=0;k<5;k++){
        const yy=y-16+k*8;
        ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+(side?-12:12),yy-5);ctx.moveTo(x,yy);ctx.lineTo(x+(side?-12:12),yy+5);ctx.stroke();
      }
      ctx.fillStyle='#eadbb0';ctx.beginPath();ctx.arc(x,y-27,7,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#344735';ctx.beginPath();ctx.arc(x+(side?-2:2),y-28,2,0,Math.PI*2);ctx.fill();
    }
  }
  // Pequenas samambaias fossilizadas nos cantos da travessia.
  for(const x of [28,372])for(let i=0;i<3;i++){
    const y=175+i*175;ctx.strokeStyle='#6f8d50';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y+16);ctx.quadraticCurveTo(x-6,y,x,y-18);ctx.stroke();
    for(let k=0;k<4;k++){ctx.beginPath();ctx.ellipse(x+(k%2?5:-5),y+8-k*6,5,2,-.5,0,Math.PI*2);ctx.fillStyle='#88a85c';ctx.fill();}
  }
  ctx.restore();
}

}

function drawLavaBridge(){
  const ch=game.challengeMode,progress=clamp((ch?.bridgeTimer||0)/15.5,0,1),cracks=ch?.bridgeCracks||[];
  // O rio ocupa as laterais e aparece sob o tabuleiro: a câmera fica mais afastada para revelar a ponte inteira.
  const lava=ctx.createLinearGradient(0,115,0,595);lava.addColorStop(0,'#742318');lava.addColorStop(.45,'#ff5a22');lava.addColorStop(1,'#5a1717');ctx.fillStyle=lava;ctx.fillRect(0,120,400,470);
  for(let i=0;i<13;i++){const y=138+i*37+Math.sin(elapsed*1.4+i)*7;ctx.strokeStyle=`rgba(255,${120+Math.floor(65*Math.sin(i*2))},35,${.35+.18*Math.sin(elapsed*2+i)})`;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(4,y);ctx.bezierCurveTo(26,y-15,42,y+15,69,y);ctx.moveTo(331,y);ctx.bezierCurveTo(356,y-15,374,y+15,396,y);ctx.stroke();}
  // pilares e sombras laterais
  ctx.fillStyle='#29252b';ctx.beginPath();ctx.moveTo(45,120);ctx.lineTo(355,120);ctx.lineTo(382,590);ctx.lineTo(18,590);ctx.closePath();ctx.fill();
  const deck=ctx.createLinearGradient(0,0,0,590);deck.addColorStop(0,'#707174');deck.addColorStop(.5,'#444950');deck.addColorStop(1,'#77706a');ctx.fillStyle=deck;ctx.beginPath();ctx.moveTo(72,120);ctx.lineTo(328,120);ctx.lineTo(318,590);ctx.lineTo(82,590);ctx.closePath();ctx.fill();
  // tábuas metálicas transversais para deixar claro que é uma ponte
  for(let y=132;y<590;y+=27){ctx.strokeStyle='rgba(20,25,31,.55)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(74+(y-120)*-.02,y);ctx.lineTo(326-(y-120)*-.02,y);ctx.stroke();ctx.strokeStyle='rgba(255,210,155,.16)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(80,y+2);ctx.lineTo(320,y+2);ctx.stroke();}
  // guarda-corpos e postes de sustentação
  for(const side of [-1,1]){const x=side<0?76:324;ctx.strokeStyle='#252d36';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(x,126);ctx.lineTo(side<0?84:316,586);ctx.stroke();ctx.strokeStyle='#bbc4c8';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,126);ctx.lineTo(side<0?84:316,586);ctx.stroke();for(let y=150;y<585;y+=48){const px=x+(side<0?1:-1)*(y-126)*.018;ctx.fillStyle='#303943';roundedRect(ctx,px-4,y-6,8,15,2,'#303943','#d0a36d',1);}}
  ctx.strokeStyle='#e9a65e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(76,126);ctx.lineTo(84,586);ctx.moveTo(324,126);ctx.lineTo(316,586);ctx.stroke();
  // fissuras crescentes com brilho da lava por baixo
  cracks.forEach((c,i)=>{const wide=Math.max(10,c.size),ang=c.angle||0;ctx.save();ctx.translate(c.x,c.y);ctx.rotate(ang);ctx.strokeStyle=`rgba(255,105,35,${.75+progress*.2})`;ctx.lineWidth=5+progress*5;ctx.beginPath();ctx.moveTo(-wide,-wide*.5);ctx.lineTo(-wide*.35,-wide*.12);ctx.lineTo(-wide*.58,wide*.38);ctx.lineTo(0,wide*.08);ctx.lineTo(wide*.22,wide*.58);ctx.lineTo(wide*.45,wide*.08);ctx.lineTo(wide,wide*.42);ctx.stroke();ctx.strokeStyle='#171c22';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-wide,-wide*.5);ctx.lineTo(-wide*.35,-wide*.12);ctx.lineTo(-wide*.58,wide*.38);ctx.lineTo(0,wide*.08);ctx.lineTo(wide*.22,wide*.58);ctx.lineTo(wide*.45,wide*.08);ctx.lineTo(wide,wide*.42);ctx.stroke();ctx.restore();});
  if(progress>.72){ctx.fillStyle=`rgba(255,73,25,${(progress-.72)*.28})`;ctx.fillRect(70,120,260,470);}
  if(progress>.6){ctx.strokeStyle=`rgba(255,100,35,${(progress-.6)*.8})`;ctx.lineWidth=2+progress*2;for(let i=0;i<5;i++){const y=155+i*86;ctx.beginPath();ctx.moveTo(85,y);ctx.lineTo(315,y+Math.sin(i)*22);ctx.stroke();}}
  // No fim do cronômetro, uma fenda atravessa o tabuleiro e revela a lava abaixo.
  if(progress>.82){
    const collapse=clamp((progress-.82)/.18,0,1),gapH=4+collapse*48,gy=368+Math.sin(elapsed*7)*2;
    ctx.save();ctx.fillStyle='#120e13';ctx.beginPath();
    ctx.moveTo(81,gy-4);ctx.lineTo(112,gy+3);ctx.lineTo(145,gy-5);ctx.lineTo(178,gy+4);ctx.lineTo(211,gy-6);ctx.lineTo(246,gy+4);ctx.lineTo(281,gy-3);ctx.lineTo(319,gy+5);
    ctx.lineTo(319,gy+gapH);ctx.lineTo(282,gy+gapH-4);ctx.lineTo(247,gy+gapH+5);ctx.lineTo(211,gy+gapH-3);ctx.lineTo(177,gy+gapH+4);ctx.lineTo(145,gy+gapH-5);ctx.lineTo(112,gy+gapH+4);ctx.lineTo(81,gy+gapH);ctx.closePath();ctx.fill();
    const lavaGlow=ctx.createLinearGradient(0,gy-3,0,gy+gapH+4);lavaGlow.addColorStop(0,'rgba(255,91,28,0)');lavaGlow.addColorStop(.5,`rgba(255,111,34,${.35+collapse*.55})`);lavaGlow.addColorStop(1,'rgba(255,91,28,0)');ctx.fillStyle=lavaGlow;ctx.fillRect(82,gy-3,236,gapH+8);
    ctx.strokeStyle=`rgba(255,143,58,${.55+collapse*.4})`;ctx.lineWidth=2+collapse*3;ctx.beginPath();ctx.moveTo(81,gy-4);ctx.lineTo(112,gy+3);ctx.lineTo(145,gy-5);ctx.lineTo(178,gy+4);ctx.lineTo(211,gy-6);ctx.lineTo(246,gy+4);ctx.lineTo(281,gy-3);ctx.lineTo(319,gy+5);ctx.stroke();ctx.restore();
  }
  if(ch?.bridgeTimer>11.5){roundedRect(ctx,103,90,194,22,7,'rgba(20,8,8,.82)','#ff8b52',1);text('A PONTE ESTÁ CEDENDO!',200,101,8,'#ffe0be',950,'center');}
}

function drawSecretWhispers(){
  // Pequenas frases quase escondidas: dão pistas sem entregar os locais secretos.
  ctx.save();
  if(!game.challengeMode){
    if(game.phase===1)text('Às vezes, o caminho continua depois da última faixa...',200,558,7,'rgba(225,239,220,.62)',650,'center');

    if(game.phase===50)text('Nem todo guardião precisa ser vencido para seguir adiante.',200,548,7,'rgba(255,220,160,.62)',650,'center');
    if(game.phase===55)text('A lua parece maior quando se olha para além da borda.',355,350,7,'rgba(220,230,255,.62)',650,'center');

}

  if(!f.c&&T>=D.energy){f.c=1;sfx('boss');game.shake=Math.max(game.shake||0,1.4);}
  if(T>=D.energy&&T<D.boy&&T-(f.tick||0)>.6){f.tick=T;sfx('crack');}
  if(!f.x1&&T>=D.bodyFade){f.x1=1;sfx('boss');sfx('hit');sfx('crack');game.shake=Math.max(game.shake||0,2.2);}
  if(!f.x2&&T>=D.bodyFade+.45){f.x2=1;sfx('boss');sfx('hit');game.shake=Math.max(game.shake||0,1.6);}

function render(){

  ctx.clearRect(0,0,BASE_W,BASE_H);

  if(game.screen==='menu')drawMenu();
  else if(game.screen==='worlds')drawWorlds();
  else if(game.screen==='settings')drawSettings();
  else if(game.screen==='levels')drawLevels();
  else if(game.screen==='challenges')drawChallenges();
  else if(game.screen==='shop')drawShop();
  else if(game.screen==='customize')drawCustomize();
  else if(game.screen==='credits')drawCredits();
  else if(game.screen==='achievements')drawAchievements();
  else if(game.screen==='playing'){if(game.eventBossFight)drawEventBossGame();else if(game.boss)drawBossGame();else drawRoadGame();}
  else if(game.screen==='cutscene')drawTravelCutscene();
  else if(game.screen==='storyEnding')drawStory1Ending();
  else if(game.screen==='story1Complete'){drawStory1Complete();}
  else if(game.screen==='challengeVictory'){drawMenuBackground();game.buttons=[];roundedRect(ctx,28,244,344,230,'rgba(10,18,27,.94)','#77d99b',2);text('DESAFIO CONCLUÍDO!',200,288,21,'#fff',950,'center');text('+25 MOEDAS',200,324,14,'#ffe18a',900,'center');text(`${(game.completedChallenges||[]).length}/30 DESAFIOS CONCLUÍDOS`,200,352,9,'#a8ffc1',850,'center');drawButton(82,386,236,42,'OUTROS DESAFIOS','challenges');drawButton(82,438,236,38,'MENU PRINCIPAL','menu',{small:true});}

  else if(game.screen==='betaEnd'){drawMenuBackground();game.buttons=[];roundedRect(ctx,24,220,352,280,'rgba(10,18,27,.93)','#8fc56c',2);text('CAMPANHA CONCLUÍDA!',200,275,22,'#fff',950,'center');text('VOCÊ DERROTOU O TRANSFORMER FÓSSIL!',200,323,11,'#b8e99a',900,'center');text('DINOSSAUROS, FÓSSEIS E METEOROS',200,355,10,'#e7eee2',800,'center');text('Você conquistou a Dimensão do Caos',200,398,9,'#c4d1d8',700,'center');text('A travessia chegou ao fim.',200,416,9,'#c4d1d8',700,'center');drawButton(80,445,240,46,'V O L T A R A O M E N U','menu');}
  else if(game.screen==='paused'){if(game.eventBossFight)drawEventBossGame();else if(game.boss)drawBossGame();else drawRoadGame();drawOverlay('PAUSADO','Sua travessia está em pausa.',[{label:'CONTINUAR',action:'resume'},{label:'VOLTAR AO MENU',action:'menu'}]);}
  else if(game.screen==='gameover'){
    if(game.boss)drawBossGame();else drawRoadGame();
    drawOverlay('VOCÊ FOI ATINGIDO','A fase atual será reiniciada.',[{label:'TENTAR NOVAMENTE',action:'retry'},{label:'MENU PRINCIPAL',action:'menu'}]);
  } else if(game.screen==='victory'){
    drawMenuBackground();game.buttons=[];roundedRect(ctx,24,230,352,260,'rgba(10,18,27,.9)','#ed3947',2);text('VOCÊ ATRAVESSOU A RUA!',200,285,21,'#fff',900,'center');text('VOCÊ CONCLUIU OS 6 MUNDOS',200,330,11,'#ffbf81',800,'center');text('E DERROTOU O CHEFE FINAL.',200,355,11,'#d5e2e7',700,'center');drawButton(80,410,240,48,'V O L T A R A O M E N U','menu');

function canvasPoint(e){const r=canvas.getBoundingClientRect();const x=(e.clientX-r.left-offsetX)/scale;const y=(e.clientY-r.top-offsetY)/scale;return{x,y};}
// Pergunta o nome sem travar o jogo: se o navegador bloquear a caixa de diálogo (comum em celular e
// em visualizadores de arquivo), o jogo segue com o nome salvo ou o padrão em vez de ficar parado.
function askPlayerName(def){
  try{const t0=performance.now();const r=window.prompt('Qual nome você quer usar no jogo?',def);
    if(r===null&&performance.now()-t0<120)return def;
    return r;}catch(e){return def;}
}
function triggerAction(actionId){
  if(actionId==='missions'){game.missionPanelOpen=true;clearDirection();return;}
  if(actionId==='closeMissions'){game.missionPanelOpen=false;game.message='BOA SORTE NAS MISSÕES!';game.messageTimer=1.4;return;}
  if(actionId==='new'){game.screen='newConfirm';game.buttons=[];return;}
  if(actionId==='continue'){if(loadSave()){if(!game.playerName){const entered=askPlayerName('Jogador');if(entered===null)return;game.playerName=String(entered).trim().slice(0,16)||'Jogador';safeSave();}continueCampaign();}return;}
  if(actionId==='replayStoryEnding'){game.story1Completed=false;startStory1Ending();return;}
  if(actionId==='worlds'){game.screen='worlds';return;}
  if(actionId==='challenges'){game.screen='challenges';game.challengePage=0;return;}
  if(actionId==='challengePrev'){game.challengePage=Math.max(0,(game.challengePage||0)-1);return;}
  if(actionId==='challengeNext'){game.challengePage=Math.min(Math.ceil(CHALLENGE_DEFS.length/10)-1,(game.challengePage||0)+1);return;}
  if(actionId.startsWith('challenge-')){launchChallenge(actionId.slice(10));return;}
  if(actionId==='retryChallenge'){const ch=game.lastChallengeId;if(ch)launchChallenge(ch);return;}
  if(actionId==='levelsPrev'){game.levelPage=0;return;}
  if(actionId==='levelsNext'){game.levelPage=1;return;}
  if(actionId==='settings'){game.screen='settings';return;}
  if(actionId==='levels'){game.screen='levels';return;}
  if(actionId==='shop'){game.shopTab='clothes';game.screen='shop';return;}
  if(actionId==='customize'){game.screen='customize';return;}
  if(actionId==='shopClothes'){game.shopTab='clothes';game.shopPage=0;return;}
  if(actionId==='shopAccessories'){game.shopTab='accessories';game.shopPage=0;return;}
  if(actionId==='shopBoxes'){game.shopTab='boxes';return;}
  if(actionId==='shopPagePrev'){game.shopPage=Math.max(0,game.shopPage-1);return;}
  if(actionId==='shopPageNext'){game.shopPage++;return;}
  if(actionId==='closeShopInfo'){game.shopInfoText=null;return;}
  if(actionId.startsWith('rewardInfo-')){const id=actionId.slice(11),o=ACHIEVEMENT_OUTFITS[id];if(o){game.shopInfoText=`${o.name}: ${o.requirement} Conquista necessária: ${ACHIEVEMENT_DEFS.find(a=>a.id===o.achievement)?.name||o.achievement}.`;}return;}
  if(actionId.startsWith('wearReward-')){const id=actionId.slice(11),o=ACHIEVEMENT_OUTFITS[id];if(o&&game.achievements[o.achievement]){game.skin.outfit=id;safeSave();}return;}
  if(actionId==='achievementPrev'){game.achievementPage=Math.max(0,game.achievementPage-1);return;}
  if(actionId==='achievementNext'){game.achievementPage=Math.min(Math.ceil(ACHIEVEMENT_DEFS.length/10)-1,game.achievementPage+1);return;}
  if(actionId==='useItem'){useInventoryItem();return;}
  if(actionId==='jumpNow'){jumpPlayer();return;}
  if(actionId.startsWith('selectItem-')){const kind=actionId.slice(11);if(ITEM_NAMES[kind])game.selectedItem=kind;return;}
  if(actionId.startsWith('shirt-')){const c=SHIRT_COLORS.find(v=>v.id===actionId.slice(6));if(c){game.skin.shirt=c.color;game.skin.shirtDesign='plain';game.skin.outfit=null;safeSave();}return;}
  if(actionId.startsWith('specialShirt-')){const id=actionId.slice(13);if(game.shirtsUnlocked[id]){game.skin.shirtDesign=id;game.skin.shirt=id==='skull'?'#222831':id==='dragon'?'#e43846':id==='road'?'#9b59c9':id==='burger'?'#a87843':id==='sixseven'?'#2786d8':'#2786d8';game.skin.outfit=null;safeSave();}return;}
  if(actionId.startsWith('pants-')){const c=PANTS_COLORS.find(v=>v.id===actionId.slice(6));if(c){game.skin.pants=c.color;game.skin.outfit=null;safeSave();}return;}
  if(actionId==='skin-light'||actionId==='skin-dark'){game.skin.skinTone=actionId==='skin-dark'?'dark':'light';safeSave();return;}
  if(actionId==='hair-straight'||actionId==='hair-spiky'||actionId==='hair-short'){game.skin.hair=actionId.slice(5);safeSave();return;}
  if(actionId==='hat-none'){game.skin.hat='none';game.skin.outfit=null;safeSave();return;}
  if(actionId==='hat-beret'){if(game.achievements.jorge){game.skin.hat='beret';game.skin.outfit=null;safeSave();}return;}
  if(actionId.startsWith('accessory-')){const id=actionId.slice(10);if(id==='none'){game.skin.hat='none';game.skin.outfit=null;safeSave();return;}if(game.ownedAccessories[id]||(id==='beret'&&game.achievements.jorge)){game.skin.hat=id;game.skin.outfit=null;safeSave();}return;}
  if(actionId.startsWith('buyAccessory-')){const id=actionId.slice(13),a=ACCESSORY_DEFS[id];if(a&&!game.ownedAccessories[id]&&game.wallet>=a.price&&(!a.unlock||game.achievements[a.unlock])){game.wallet-=a.price;game.ownedAccessories[id]=true;game.skin.hat=id;game.skin.outfit=null;game.message=`${a.name.toUpperCase()} ADQUIRIDO!`;game.messageTimer=2.0;safeSave();}return;}
  if(actionId.startsWith('wear-')){const id=actionId.slice(5);if(game.ownedOutfits[id]&&PREMIUM_OUTFITS[id]){game.skin.outfit=id;safeSave();}return;}
  if(actionId.startsWith('buyOutfit-')){const id=actionId.slice(10),o=PREMIUM_OUTFITS[id];if(o&&!game.ownedOutfits[id]&&game.wallet>=o.price){game.wallet-=o.price;game.ownedOutfits[id]=true;game.skin.outfit=id;game.message=`${o.name.toUpperCase()} ADQUIRIDO!`;safeSave();}return;}
  if(actionId==='buyCrate'){
    if(game.wallet<SHOP_CRATE_PRICE)return;game.wallet-=SHOP_CRATE_PRICE;
    const roll=Math.random();
    if(roll<.42){const choices=LOOT_OUTFITS.filter(id=>!game.ownedOutfits[id]);if(choices.length){const id=choices[Math.floor(Math.random()*choices.length)];game.ownedOutfits[id]=true;game.skin.outfit=id;game.message=`CAIXA: ${PREMIUM_OUTFITS[id].name.toUpperCase()}!`;}else{game.wallet+=25;game.message='VOCÊ JÁ TEM ESSAS ROUPAS. +25 MOEDAS!';}}
    else{const item=randomRewardItem();game.inventory[item]++;game.selectedItem=item;game.message=`CAIXA: ${ITEM_NAMES[item]} +1!`;}
    game.messageTimer=2.5;sfx('win');safeSave();return;
  }
  if(actionId.startsWith('graphics-')){const q=actionId.slice(9);if(['low','medium','high'].includes(q)){game.graphicsQuality=q;fitCanvas();game.message=`GRÁFICOS: ${q.toUpperCase()}`;safeSave();}return;}
  if(actionId==='toggleMusic'){game.musicEnabled=!game.musicEnabled;if(game.musicEnabled)startMusic();else stopMusic();safeSave();return;}
  if(actionId==='toggleSfx'){game.sfxEnabled=!game.sfxEnabled;safeSave();return;}
  if(actionId==='volumeDown'){game.musicVolume=clamp(game.musicVolume-.1,0,1);if(game.musicVolume===0)stopMusic();else if(game.musicEnabled)startMusic();safeSave();return;}
  if(actionId==='volumeUp'){game.musicVolume=clamp(game.musicVolume+.1,0,1);if(game.musicEnabled)startMusic();safeSave();return;}
  if(actionId.startsWith('level-')){const n=Number(actionId.slice(6)),maxPassed=game.campaignCompleted?175:Math.max(1,game.highest);if(n>=176&&n<=200&&game.brazilUnlocked){game.phase=n;game.world=7;game.campaignEligible=false;game.lives=3;game.screen='playing';startPhase();return;}if(n>=1&&n<=175&&n<=maxPassed){game.phase=n;game.world=worldForPhase(n);game.campaignEligible=false;game.lives=3;game.screen='playing';startPhase();}return;}
  if(actionId==='credits'){game.screen='credits';return;}
  if(actionId==='achievements'){game.screen='achievements';return;}
  if(actionId==='back'){game.screen='menu';return;}
  if(['world1','world2','world3','world4','world5','world6'].includes(actionId)){
    const w=Number(actionId.slice(-1));const isUnlocked=w===1||(w===2&&game.unlocked.desert)||(w===3&&game.unlocked.moon)||(w===4&&game.unlocked.volcano)||(w===5&&game.unlocked.prehistoric)||(w===6&&game.unlocked.chaos);
    if(isUnlocked){game.selectedWorld=w;game.phase=w===1?1:w===2?26:w===3?51:w===4?76:w===5?101:126;game.campaignEligible=false;if(w===1)game.campaignDeaths=0;updateUnlocks();safeSave();startPhase();}
    return;
  }
  if(actionId==='resume'){game.screen='playing';return;}
  if(actionId==='menu'){if(game.challengeMode){game.phase=game.challengeMode.originalPhase;game.world=worldForPhase(game.phase);game.challengeMode=null;game.scriptedEvent=null;game.sideEvent=null;game.miniBoss=null;game.boss=null;}game.screen='menu';safeSave();return;}
  if(actionId==='retry'){
    // Qualquer desafio é reconstruído isoladamente; nenhum retry volta a carregar uma fase da campanha.
    if(game.challengeMode){
      const challengeId=game.challengeMode.id;
      const originalPhase=game.challengeMode.originalPhase;
      const reachedStage=game.challengeMode.customMap?clamp(game.challengeMode.challengeStage||1,1,5):1;
      launchChallenge(challengeId);
      game.challengeMode.originalPhase=originalPhase;
      for(let stage=1;stage<reachedStage;stage++)advanceEliteChallengeStage();
      game.player.invuln=1.8;game.transition=0;return;
    }
    startPhase();return;

function update(dt){
  if(game.musicEnabled&&game.musicVolume>0&&(!musicTimer||currentMusicTrack()!==musicTrackKey))startMusic();
  elapsed+=dt;
  if(game.returnFlash>0)game.returnFlash-=dt;
  if(game.messageTimer>0)game.messageTimer-=dt;
  if(game.achievementToast)updateAchievementToast(dt);
  if(game.screen==='playing'||game.screen==='cutscene'){advanceDialogue(dt);updateComets(dt);}
  if(game.particles.length)game.particles.length=0; // Limpeza defensiva: partículas não são usadas na renderização.
  if(game.screen==='storyEnding'&&game.storyEnding){
    game.storyEnding.timer+=dt;
    if(game.storyEnding.timer>=game.storyEnding.duration)finishStory1Ending();
    return;
  }
  if(game.screen==='cutscene'&&game.cutscene){
    game.cutscene.timer+=dt;
    if(game.cutscene.timer>=game.cutscene.duration){game.cutscene=null;game.screen='playing';advancePhase();}
    return;
  }
  if(game.screen==='playing'){
    if(game.missionPanelOpen){if(elapsed-game.lastSave>5)safeSave();return;}
    // Recupera a arena caso um save antigo/incompleto entre na fase 50 sem o chefe.
    if(game.phase===50&&!game.campaignCompleted&&!game.boss&&game.transition<=0)startBoss('bee');
    if(!game.campaignCompleted&&!game.challengeMode)game.campaignTime+=dt;
    if(game.tapMoveUntil&&elapsed>game.tapMoveUntil){game.tapMoveUntil=0;clearDirection();}
    if(game.bossDefeated&&game.boss){
      game.boss.explosionAge=(game.boss.explosionAge||0)+dt;
      if(game.boss.type==='colossal')colossalDefeatFx(game.boss);
      // O personagem fica protegido e imóvel enquanto a mensagem de vitória aparece.
      game.input={x:0,y:0};game.heldDir=null;
    } else if(game.eventBossFight){updateEventBossFight(dt);}else if(game.boss){updatePlayer(dt);updateBoss(dt);}else updateNormal(dt);
    if(game.screen==='playing'&&!game.bossDefeated&&!game.eventBossFight&&!game.miniBoss)updateDragon(dt);
    if(game.screen==='playing'&&!game.bossDefeated&&!game.eventBossFight)updateBlueCoin(dt);
    if(game.screen==='playing'&&!game.bossDefeated&&!game.eventBossFight)updateLegendaryCoin(dt);
    if(game.transition>0){
      game.transition-=dt;
      if(game.transition<=0){
        game.transition=0;
        if(game.bossDefeated&&game.boss){
          if(game.bossTransitionHandled)return;
          game.bossTransitionHandled=true;
          const defeatedType=game.boss.type;
          game.boss=null;
          game.bossDefeated=false;
          if(defeatedType==='green')startTravelCutscene('jet');
          else if(defeatedType==='bee')startTravelCutscene('rocket');
          else if(defeatedType==='magma')startTravelCutscene('timeMachine');
          else if(defeatedType==='alien')startTravelCutscene('moonEruption');
          else if(defeatedType==='bone')startTravelCutscene('chaosIntro');
          else if(defeatedType==='colossal'){finishCampaign();game.whiteInUntil=elapsed+1.3;}
          else if(defeatedType==='cyber'&&game.phase===200){startBrazilVictoryCutscene();}
          else advancePhase();
        } else if(!game.boss&&!game.miniBoss&&!game.eventBossFight){
          if(game.challengeMode&&game.challengeMode.customMap&&(game.challengeMode.challengeStage||1)<5){advanceEliteChallengeStage();}
          else advancePhase();
        }
      }
    }
    if(elapsed-game.lastSave>5)safeSave();
  }
}
// Beta 33 — renderização estável.
// O loop usa requestAnimationFrame do navegador e um limitador simples.
// Evita acumular prazos futuros, que podia deixar a tela sem novos desenhos
// em alguns ritmos de atualização de celulares.
let targetFrameMs=1000/30;
let lastRenderAt=0;
let lastUpdateAt=0;
let measuredFps=0, measuredFrames=0, perfWindowStart=performance.now();
let renderCostAverage=0;

function loop(ts){
  requestAnimationFrame(loop);

  if(document.hidden){
    lastRenderAt=0;
    lastUpdateAt=0;
    return;
  }

  const activeScreen = game.screen==='playing' || game.screen==='cutscene' || game.screen==='storyEnding' || game.screen==='brazilVictory';
  targetFrameMs = activeScreen ? (1000/30) : 50;

  if(!lastRenderAt){
    lastRenderAt=ts-targetFrameMs;
    lastUpdateAt=ts-targetFrameMs;
  }

  const sinceRender=ts-lastRenderAt;
  if(sinceRender < targetFrameMs-1) return;

  // Usa o tempo real desde a última atualização, com limite para evitar
  // saltos enormes ao voltar de uma pausa do navegador.
  const dt=Math.min(.05,Math.max(.001,(ts-lastUpdateAt)/1000));
  lastRenderAt=ts;
  lastUpdateAt=ts;

  const workStart=performance.now();
  update(dt);
  renderWithNewConfirm();
  const work=performance.now()-workStart;

  renderCostAverage=renderCostAverage ? renderCostAverage*.9+work*.1 : work;
  measuredFrames++;
  const perfNow=performance.now();
  if(perfNow-perfWindowStart>=1000){
    measuredFps=measuredFrames/((perfNow-perfWindowStart)/1000);
    measuredFrames=0;
    perfWindowStart=perfNow;
  }
}
requestAnimationFrame(loop);

  lastFrame=0;
  if(document.hidden){clearDirection();}
});

  for(const type of ['brTrap','brRobot','brTrio','brConfetti','brCannon'])cap(type,3);

// Movimento real dos robozinhos, dos trios e dos confetes que caem em trio.
const brazilUpdateNormalV2Base=updateNormal;
updateNormal=function(dt){
  brazilUpdateNormalV2Base(dt);
  if(game.phase<176||game.phase>200||game.screen!=='playing'||game.boss)return;
  for(const h of game.hazards){
    if(h.type==='brRobot'||h.type==='brTrio'){
      const speed=h.type==='brRobot'?1:1;
      h.x+=(h.vx||80)*dt*speed;
      const limit=h.type==='brTrio'?62:34;
      if(h.x<limit){h.x=limit;h.vx=Math.abs(h.vx||80);}
      if(h.x>400-limit){h.x=400-limit;h.vx=-Math.abs(h.vx||80);}
      h.y+=Math.sin(elapsed*3.6+(h.phase||0))*9*dt;
      const radius=h.type==='brTrio'?45:18;
      if(Math.hypot(game.player.x-h.x,game.player.y-h.y)<radius+10&&game.player.invuln<=0){hurtPlayer('brazil');if(game.screen!=='playing')return;}
    } else if(h.type==='brConfetti'){
      h.y+=(h.vy||96)*dt;h.x+=Math.sin(elapsed*4+(h.phase||0))*13*dt;
      if(h.y>600){h.y=132;h.x=rand(38,362);h.phase=rand(0,6.28);}
      if(Math.hypot(game.player.x-h.x,game.player.y-h.y)<16&&game.player.invuln<=0){hurtPlayer('brazil');if(game.screen!=='playing')return;}
    } else if(h.type==='brCannon'){
      if(h.projectile){h.projectile.vy=180;h.projectile.vx=clamp((game.player.x-h.projectile.x)*.5,-125,125);}
    }
  }
};

// Sequência de lasers em coluna: um disparo a cada meio segundo, mantendo uma única faixa segura.
const brazilBossUpdateV2Base=updateBoss;
updateBoss=function(dt){
  const before=game.boss,activeBefore=!!(before&&(game.phase===190||game.phase===200));
  if(activeBefore&&!before.defeated&&before.introTimer<=0){
    before.chaosAttackTimer=Math.min(before.chaosAttackTimer||1,game.phase===200?.78:1.08);
    before.coreTimer=Math.min(before.coreTimer||1.5,game.phase===200?1.2:1.45);
    if(before.dashActive<=0)before.dashTimer=Math.min(before.dashTimer||3,game.phase===200?2.6:3.0);
  }
  brazilBossUpdateV2Base(dt);
  const b=game.boss;if(!b||b.defeated||game.bossDefeated||game.screen!=='playing'||game.phase!==190||b.introTimer>0)return;
  if(b.brazilLaserClock===undefined)b.brazilLaserClock=game.phase===200?3.8:5.5;
  if(!b.brazilLaserSeq){
    b.brazilLaserClock-=dt;
    if(b.brazilLaserClock<=0){
      const slots=game.phase===200?[34,89,144,199,254,309,364]:[55,127,200,273,345];
      const gap=Math.floor(Math.random()*slots.length);
      b.brazilLaserSeq={slots,gap,index:0,next:0};
      game.message='SEQUÊNCIA DE LASERS! UMA FAIXA ESTÁ LIVRE!';game.messageTimer=1.7;sfx('boss');
    }
  }
  const seq=b.brazilLaserSeq;
  if(seq){
    seq.next-=dt;
    if(seq.next<=0&&seq.index<seq.slots.length){
      const i=seq.index++;
      if(i!==seq.gap)b.projectiles.push({kind:'cyberBeam',x:seq.slots[i],y:220,life:1.02});
      seq.next=.5;sfx('fire');
    }
    if(seq.index>=seq.slots.length&&seq.next<=0){b.brazilLaserSeq=null;b.brazilLaserClock=game.phase===200?5.0:7.2;}
  }
};

// Os canhões permanecem ativos mesmo durante as lutas dos chefes brasileiros.
const brazilBossCannonsUpdateBase=updateBoss;
updateBoss=function(dt){
  brazilBossCannonsUpdateBase(dt);
  if((game.phase!==195&&game.phase!==196&&game.phase!==197&&game.phase!==198&&game.phase!==199&&game.phase!==200)||!game.boss||game.boss.defeated||game.boss.introTimer>0||game.screen!=='playing')return;
  const cannons=game.hazards.filter(h=>h.type==='brCannon');
  // Um único disparo de canhão por vez, com intervalo global de 10 segundos.
  if(game.boss.brazilCannonClock===undefined)game.boss.brazilCannonClock=10;
  game.boss.brazilCannonClock-=dt;
  if(game.boss.brazilCannonClock<=0&&!game.boss.brazilCannonProjectile&&cannons.length){
    const index=(game.boss.brazilCannonIndex||0)%cannons.length;
    const cannon=cannons[index],dx=game.player.x-cannon.x;
    game.boss.brazilCannonProjectile={x:cannon.x,y:cannon.y+8,vx:clamp(dx*.5,-115,115),vy:185};
    game.boss.brazilCannonIndex=(index+1)%cannons.length;
    game.boss.brazilCannonClock=10;
  }
  const shot=game.boss.brazilCannonProjectile;
  if(shot){
    shot.x+=shot.vx*dt;shot.y+=shot.vy*dt;
    if(Math.hypot(game.player.x-shot.x,game.player.y-shot.y)<18&&game.player.invuln<=0){
      game.boss.brazilCannonProjectile=null;hurtPlayer('brazilCannon');
      if(game.screen!=='playing')return;
    } else if(shot.y>610)game.boss.brazilCannonProjectile=null;
  }
};

function drawBrazilVictoryCutscene(){
  const t=game.brazilVictory?game.brazilVictory.timer:0;
  const sky=ctx.createLinearGradient(0,0,0,720);sky.addColorStop(0,'#073c55');sky.addColorStop(.52,'#087b57');sky.addColorStop(1,'#073a32');ctx.fillStyle=sky;ctx.fillRect(0,0,400,720);
  // Skyline, coastline and a festive avenue.
  ctx.fillStyle='rgba(3,25,35,.55)';for(let i=0;i<9;i++){const x=i*51-8,h=70+(i%4)*22;ctx.fillRect(x,300-h,35,h);}
  ctx.fillStyle='#1688a0';ctx.fillRect(0,370,400,90);ctx.fillStyle='#f1d28a';ctx.fillRect(0,460,400,260);
  ctx.fillStyle='#343c40';ctx.fillRect(0,520,400,200);ctx.setLineDash([20,18]);ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,620);ctx.lineTo(400,620);ctx.stroke();ctx.setLineDash([]);
  // Carnival pennants overhead.
  for(let i=0;i<11;i++){const x=i*40-8;ctx.strokeStyle='#f5d65b';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,20);ctx.lineTo(x+14,48);ctx.stroke();ctx.fillStyle=['#19a85b','#ffdf45','#2876d2','#f15a53'][i%4];ctx.beginPath();ctx.moveTo(x+7,33);ctx.lineTo(x+23,37);ctx.lineTo(x+17,57);ctx.closePath();ctx.fill();}
  if(t<4.5){
    if(t<1.68){
      // Primeiro o gigante perde o equilíbrio e cai, ainda inteiro.
      const fall=clamp(t/2.7,0,1),shake=Math.sin(t*28)*(1-fall)*5;
      ctx.save();ctx.translate(200+shake,205+170*fall);ctx.rotate(fall*.48);
      drawBrazilFinalBoss(0,0,0,t*3);ctx.restore();
      for(let i=0;i<12;i++){const a=i*Math.PI/6+t*2,r=45+t*28;ctx.fillStyle=['#20d56b','#ffe34d','#2685e8'][i%3];ctx.beginPath();ctx.arc(200+Math.cos(a)*r,300+Math.sin(a)*r*.7,3+(i%3),0,Math.PI*2);ctx.fill();}
      ctx.fillStyle='rgba(5,13,19,.58)';ctx.fillRect(0,100,400,70);text('O GIGANTE ESTÁ CAINDO!',200,135,15,'#fff4c4',950,'center');
    }else{
      // Explosão: cabeça, teto, peito, caixas de som, braços e pernas se soltam.
      const age=t-1.68;
      const pieces=[
        {kind:'head',x:0,y:-120,vx:-18,vy:-132,gravity:52,rot:-.15,spin:-2.6,life:3.0},
        {kind:'roof',x:0,y:-88,vx:28,vy:-166,gravity:46,rot:0,spin:2.5,life:3.05},
        {kind:'chest',x:0,y:-14,vx:-8,vy:-58,gravity:68,rot:0,spin:1.5,life:3.15},
        {kind:'speaker',x:-55,y:-24,vx:-135,vy:-66,gravity:78,rot:0,spin:-4.1,life:2.8},
        {kind:'speaker',x:55,y:-24,vx:139,vy:-75,gravity:78,rot:0,spin:4.2,life:2.8},
        {kind:'arm',x:-83,y:-38,vx:-158,vy:-5,gravity:92,rot:-.2,spin:-4.8,life:2.75},
        {kind:'arm',x:83,y:-38,vx:162,vy:-8,gravity:92,rot:.2,spin:4.9,life:2.75},
        {kind:'leg',x:-50,y:48,vx:-91,vy:67,gravity:98,rot:-.1,spin:-3.1,life:2.8},
        {kind:'leg',x:50,y:48,vx:96,vy:64,gravity:98,rot:.1,spin:3.2,life:2.8},
        {kind:'skirt',x:0,y:35,vx:7,vy:126,gravity:90,rot:0,spin:2.4,life:2.65,seed:2},
        {kind:'leg',x:-53,y:69,vx:-105,vy:125,gravity:115,rot:.1,spin:-5,life:2.55},
        {kind:'leg',x:53,y:69,vx:110,vy:122,gravity:115,rot:-.1,spin:5,life:2.55}
      ];
      // Clarão inicial e anéis de energia atrás dos destroços.
      const flash=Math.max(0,1-age*2.3);if(flash>0){ctx.fillStyle=`rgba(255,249,205,${flash*.92})`;ctx.beginPath();ctx.arc(200,309,18+age*145,0,Math.PI*2);ctx.fill();}
      ctx.strokeStyle=`rgba(255,220,86,${Math.max(0,.75-age*.28)})`;ctx.lineWidth=5;ctx.beginPath();ctx.arc(200,309,35+age*90,0,Math.PI*2);ctx.stroke();
      for(let i=0;i<30;i++){const a=i*Math.PI*2/30+age*1.4,r=25+age*(80+(i%5)*12);const x=200+Math.cos(a)*r,y=309+Math.sin(a)*r*.72;ctx.fillStyle=['#20d56b','#ffe34d','#2685e8','#fff4c4'][i%4];ctx.save();ctx.translate(x,y);ctx.rotate(a+age*5);ctx.fillRect(-3,-8,6,16);ctx.restore();}
      for(const p of pieces)drawBrazilBossBreakupPiece(p,age);
      // Pequenas faíscas reforçam a sensação de metal se partindo.
      for(let i=0;i<18;i++){const a=i*2.399+age*2.2,r=35+((i*31)%95)+age*24;const x=200+Math.cos(a)*r,y=309+Math.sin(a)*r+age*18;ctx.fillStyle=i%2?'#ffe66b':'#b7f7ff';ctx.beginPath();ctx.arc(x,y,1.5+(i%3),0,Math.PI*2);ctx.fill();}
      ctx.fillStyle='rgba(5,13,19,.58)';ctx.fillRect(0,100,400,70);text('A ARMADURA FOI DESMONTADA!',200,130,15,'#fff4c4',950,'center');text('AS PEÇAS DO GIGANTE SE ESPALHARAM!',200,153,9,'#8dffb2',900,'center');
    }
  }else{
    // Protagonista e robozinhos dançam juntos; braços, pernas e saias animados.
    const dance=Math.sin(t*7),bounce=Math.abs(Math.sin(t*7))*9;
    ctx.fillStyle='rgba(0,0,0,.24)';ctx.beginPath();ctx.ellipse(200,655,165,20,0,0,Math.PI*2);ctx.fill();
    for(let i=0;i<4;i++){
      const x=58+i*95,y=570-bounce*(i%2?1:.75);drawBrazilRobot(x,y,{phase:t*5+i});
      ctx.save();ctx.translate(x,y+19);ctx.rotate(dance*.16*(i%2?1:-1));ctx.fillStyle=['#18a85b','#f4d33f','#2877d5','#18a85b'][i%4];ctx.beginPath();ctx.moveTo(-17,0);ctx.lineTo(17,0);ctx.lineTo(23,22);ctx.lineTo(-23,22);ctx.closePath();ctx.fill();ctx.restore();
    }
    drawBoy(200,535-bounce,1.85,t*5,0);
    ctx.save();ctx.translate(200,548-bounce);ctx.rotate(dance*.18);ctx.strokeStyle='#f1c18e';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-12,-20);ctx.lineTo(-29,-42-8*dance);ctx.moveTo(12,-20);ctx.lineTo(30,-42+8*dance);ctx.stroke();ctx.restore();
    // Confetes em chuva contínua.
    for(let i=0;i<65;i++){const x=(i*67+Math.sin(t*2+i)*22)%420,y=((i*53-t*95)%760+760)%760;ctx.fillStyle=['#ffe34d','#27d46b','#3989ed','#fff2d1'][i%4];ctx.save();ctx.translate(x,y);ctx.rotate(t*3+i);ctx.fillRect(-2,-4,4,8);ctx.restore();}
    const a=clamp((t-5.2)/1.2,0,1);ctx.fillStyle=`rgba(3,18,22,${.68*a})`;roundedRect(ctx,28,105,344,74,13,`rgba(3,18,22,${.8*a})`,'rgba(255,225,90,.7)',2);
    if(a>0){text('VIVA O BRASIL!',200,132,23,'#ffe34d',950,'center');text('AGORA É HORA DE SAMBAR!',200,158,10,'#9dffbd',900,'center');}
    if(t>11.8){ctx.fillStyle=`rgba(3,14,20,${clamp((t-11.8)/1,0,.82)})`;ctx.fillRect(0,0,400,720);text('FIM DO MUNDO EXTRA',200,310,12,'#9dffbd',900,'center');text('O CARNAVAL ESTÁ SALVO!',200,355,23,'#ffe34d',950,'center');text('VOCÊ CONQUISTOU O BRASIL 🇧🇷',200,392,10,'#fff',850,'center');}
  }
}

const brazilVictoryRenderBase=render;
render=function(){if(game.screen!=='brazilVictory'){brazilVictoryRenderBase();return;}ctx.setTransform(pixelRatio*scale,0,0,pixelRatio*scale,pixelRatio*offsetX,pixelRatio*offsetY);ctx.clearRect(0,0,BASE_W,BASE_H);drawBrazilVictoryCutscene();game.buttons=[];};
const brazilVictoryUpdateBase=update;
update=function(dt){if(game.screen!=='brazilVictory'){brazilVictoryUpdateBase(dt);return;}elapsed+=dt;if(game.brazilVictory){game.brazilVictory.timer+=dt;if(game.brazilVictory.timer>=game.brazilVictory.duration){game.brazilVictory=null;game.screen='menu';game.world=7;game.phase=200;game.highest=Math.max(game.highest,200);game.boss=null;game.bossDefeated=false;safeSave();}}};

window.ONLY_CROSS_DEBUG={getState:()=>({screen:game.screen,phase:game.phase,highest:game.highest,world:game.world,unlocked:game.unlocked,cutscene:game.cutscene&&game.cutscene.type,boss:game.boss&&{type:game.boss.type,hp:game.boss.hp,introTimer:game.boss.introTimer},miniBoss:game.miniBoss&&{stage:game.miniBoss.stage,attackIndex:game.miniBoss.attackIndex},eventBossFight:game.eventBossFight&&{kind:game.eventBossFight.kind,enemies:game.eventBossFight.enemies.map(e=>({type:e.type,hp:e.hp}))},scriptedEvent:game.scriptedEvent&&game.scriptedEvent.type,sideEvent:game.sideEvent&&{type:game.sideEvent.type,persistent:!!game.sideEvent.persistent,lockPlayer:!!game.sideEvent.lockPlayer,timer:game.sideEvent.timer},scriptedEventTimer:game.scriptedEvent&&game.scriptedEvent.timer,persistentRoadCracks:persistentRoadCracksActive(),worldEventSchedule:game.worldEventSchedule,missions:game.activeMissions,missionPanelOpen:game.missionPanelOpen,cars:game.cars.length,hazards:game.hazards.length,controls:game.buttons.length,lives:game.lives,coins:game.collectedCoins.length,wallet:game.wallet,player:{x:game.player.x,y:game.player.y},performance:{targetFrameMs,renderCostAverage,fps:measuredFps,pixelRatio},campaignTime:game.campaignTime,dragonRolls:game.dragonRolls,shirtsUnlocked:game.shirtsUnlocked,inventory:game.inventory,jumpCharges:game.player.jumpCharges,achievements:game.achievements,completedChallenges:game.completedChallenges,challengeCount:CHALLENGE_DEFS.length,challengeMode:game.challengeMode&&{id:game.challengeMode.id,challengeStage:game.challengeMode.challengeStage,challengeStages:game.challengeMode.challengeStages,bridgeTimer:game.challengeMode.bridgeTimer,dynamicTimer:game.challengeMode.dynamicTimer},achievementToast:game.achievementToast,achievementQueue:game.achievementQueue,ownedAccessories:game.ownedAccessories,chest:game.chest,dialogue:game.dialogue}),startPhase,startEvent:(k)=>{startEventBossFight(k);},getFight:()=>game.eventBossFight&&{kind:game.eventBossFight.kind,intro:game.eventBossFight.intro&&game.eventBossFight.intro.t,completed:game.eventBossFight.completed,hp:game.eventBossFight.enemies.map(e=>e.hp)},killAll:()=>{if(game.eventBossFight&&!game.eventBossFight.intro)game.eventBossFight.enemies.forEach(e=>e.hp=0);},game:()=>game};

// Desenha o único projétil de canhão ativo durante a batalha do chefe.
const brazilBossCannonDrawBase=drawBossGame;
drawBossGame=function(){
  brazilBossCannonDrawBase();
  if(game.boss&&game.boss.brazilCannonProjectile){
    const p=game.boss.brazilCannonProjectile;
    ctx.save();ctx.fillStyle='#24d66b';ctx.strokeStyle='#f5e642';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(p.x,p.y,8,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();
  }
};

// Ajustes solicitados: remover a armadilha em forma de espinhos, reservar arenas dos chefes
// e usar trios elétricos como veículos nas fases normais.
const brazilRequestedStartPhaseBase = startPhase;
startPhase = function(){
  brazilRequestedStartPhaseBase();
  if(game.phase<176||game.phase>200)return;
  // A armadilha de espinhos/coroa não faz parte do conjunto aprovado: nunca aparece.
  game.hazards = game.hazards.filter(h=>h.type!=='brTrap');
  // As arenas dos dois chefes ficam livres de robôs sambistas e trios que tapariam a visão.
  if(game.phase===190||game.phase===200){
    game.hazards = game.hazards.filter(h=>h.type!=='brRobot'&&h.type!=='brTrio');
    return;
  }
  // Nas fases comuns, o trio elétrico cruza a pista como um veículo especial.
  if(game.phase>=185){
    let trios=game.hazards.filter(h=>h.type==='brTrio');
    const wanted=game.phase>=196?2:1;
    while(trios.length<wanted && trios.length<3){
      const h={type:'brTrio',x:Math.random()<.5?65:335,y:245+Math.random()*270,r:45,phase:Math.random()*6.28,active:true,vx:Math.random()<.5?92:-92};
      game.hazards.push(h);trios.push(h);
    }
    if(trios.length>3){const keep=new Set(trios.slice(0,3));game.hazards=game.hazards.filter(h=>h.type!=='brTrio'||keep.has(h));}
  }
};
const brazilRequestedDrawHazardBase=drawHazard;
drawHazard=function(h){
  if(h.type==='brTrap')return;
  brazilRequestedDrawHazardBase(h);
};
const brazilRequestedUpdateNormalBase=updateNormal;
updateNormal=function(dt){
  // Limpa qualquer armadilha antiga que tenha sido criada por uma rotina anterior.
  if(game.phase>=176&&game.phase<=200){
    game.hazards=game.hazards.filter(h=>h.type!=='brTrap');
    if(game.phase===190||game.phase===200)game.hazards=game.hazards.filter(h=>h.type!=='brRobot'&&h.type!=='brTrio');
  }
  brazilRequestedUpdateNormalBase(dt);
};

})();
